<!DOCTYPE html>
<html>
<head>
    <title>Pricing Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Pricing Plans</h2>

<button id="toggle">Switch to Yearly</button>

<div class="plans">

    <div class="card">
        <h3>Basic</h3>
        <p id="basic">₹100 / month</p>
    </div>

    <div class="card pro">
        <h3>Pro</h3>
        <p id="pro">₹200 / month</p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
