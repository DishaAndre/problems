<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Image Gallery</h2>

  <!-- Filter Buttons -->
  <div class="buttons">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('animals')">Animals</button>
    <button onclick="filterImages('cars')">Cars</button>
  </div>

  <!-- Gallery -->
  <div class="gallery">

    <img src="https://picsum.photos/300/200?1" class="image nature">
    <img src="https://picsum.photos/300/200?2" class="image animals">
    <img src="https://picsum.photos/300/200?3" class="image cars">
    <img src="https://picsum.photos/300/200?4" class="image nature">
    <img src="https://picsum.photos/300/200?5" class="image animals">
    <img src="https://picsum.photos/300/200?6" class="image cars">

  </div>

  <script src="script.js"></script>
</body>
</html>
