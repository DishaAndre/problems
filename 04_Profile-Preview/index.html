<!DOCTYPE html>
<html>
<head>
    <title>Profile Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Profile Preview</h2>

<div class="container">

    <!-- FORM -->
    <div class="form">
        <input type="text" id="name" placeholder="Enter Name"><br><br>
        <input type="text" id="email" placeholder="Enter Email"><br><br>
        <input type="text" id="role" placeholder="Enter Role"><br><br>
    </div>

    <!-- PROFILE CARD -->
    <div class="card">
        <h3 id="pname">Your Name</h3>
        <p id="pemail">Your Email</p>
        <p id="prole">Your Role</p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
