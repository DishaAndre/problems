<!DOCTYPE html>
<html>
<head>
    <title>Digital Glossary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>HTML Tag Glossary</h2>

<!-- SEARCH -->
<input type="text" id="search" placeholder="Search tags...">

<!-- TABLE -->
<table>
    <tr>
        <th>Tag</th>
        <th>Description</th>
    </tr>

    <tr>
        <td>&lt;b&gt;</td>
        <td>Bold text</td>
    </tr>

    <tr>
        <td>&lt;i&gt;</td>
        <td>Italic text</td>
    </tr>

    <tr>
        <td>&lt;u&gt;</td>
        <td>Underline text</td>
    </tr>

    <tr>
        <td>&lt;p&gt;</td>
        <td>Paragraph</td>
    </tr>

    <tr>
        <td>&lt;h1&gt;</td>
        <td>Heading</td>
    </tr>

    <tr>
        <td>&lt;br&gt;</td>
        <td>Line break</td>
    </tr>
</table>

<script src="script.js"></script>
</body>
</html>
