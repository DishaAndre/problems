<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Glossary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Digital Glossary</h2>

<!-- SEARCH BAR -->
<input type="text" id="search" placeholder="Search tags...">

<!-- TABLE -->
<table border="1">
    <tr>
        <th>Tag</th>
        <th>Description</th>
    </tr>

    <tr>
        <td>&lt;b&gt;</td>
        <td>Bold text</td>
    </tr>

    <tr>
        <td>&lt;i&gt;</td>
        <td>Italic text</td>
    </tr>

    <tr>
        <td>&lt;u&gt;</td>
        <td>Underline text</td>
    </tr>

    <tr>
        <td>&lt;p&gt;</td>
        <td>Paragraph</td>
    </tr>

    <tr>
        <td>&lt;h1&gt;</td>
        <td>Heading</td>
    </tr>
</table>

<script src="script.js"></script>
</body>
</html>
