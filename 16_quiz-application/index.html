<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Simple Quiz App</h2>

    <form id="quizForm">

        <p>1. What is the capital of India?</p>
        <input type="radio" name="q1" value="Delhi"> Delhi<br>
        <input type="radio" name="q1" value="Mumbai"> Mumbai<br><br>

        <p>2. 2 + 2 = ?</p>
        <input type="radio" name="q2" value="3"> 3<br>
        <input type="radio" name="q2" value="4"> 4<br><br>

        <p>3. Which is a programming language?</p>
        <input type="radio" name="q3" value="HTML"> HTML<br>
        <input type="radio" name="q3" value="Python"> Python<br><br>

        <button type="button" onclick="submitQuiz()">Submit</button>

    </form>

    <h3 id="result"></h3>

</div>

<script src="script.js"></script>
</body>
</html>
